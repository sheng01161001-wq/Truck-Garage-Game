<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>卡車改裝王</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡車改裝王">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- 開始畫面 -->
<div id="title">
  <div class="title-box">
    <div class="t-kicker">寫實重型卡車模擬</div>
    <h1>卡車改裝王</h1>
    <p class="sub">開聯結車送貨賺錢，把卡車改裝成你的專屬座駕。</p>
    <div class="howto">
      <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 油門／煞車（停住後按住＝倒車）／方向盤</div>
      <div><kbd>Q</kbd><kbd>E</kbd> 方向燈　<kbd>L</kbd> 大燈　<kbd>K</kbd> 雨刷　<kbd>H</kbd> 喇叭</div>
      <div><kbd>C</kbd> 換鏡頭　<kbd>T</kbd> 換時間　<kbd>Y</kbd> 換天氣　<kbd>G</kbd> 改裝廠</div>
      <div class="tip">平板手機用畫面上的按鈕。跟著小地圖的<b>橘色導航線</b>開，停進黃色<b>裝卸區</b>就會自動裝貨、卸貨。</div>
    </div>
    <button id="startBtn" class="btn-big" disabled>發動引擎</button>
    <div id="loadMsg" class="load">載入中…</div>
  </div>
</div>

<!-- 開車畫面 -->
<div id="hud" class="hidden">
  <div class="top-left">
    <div id="coins" class="chip" title="金幣">💰 <span id="coinNum">0</span></div>
  </div>
  <div id="mission">
    <div id="navArrow">➤</div>
    <div id="missionText"></div>
  </div>
  <div class="top-right">
    <button id="bGarage" class="tbtn">🔧<span>改裝廠</span></button>
    <button id="bEnv" class="tbtn">🌤<span>天氣</span></button>
    <button id="bCam" class="tbtn">📷<span>鏡頭</span></button>
    <button id="bReset" class="tbtn">🔄<span>回廠</span></button>
    <button id="bSound" class="tbtn">🔊<span>聲音</span></button>
  </div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="controls">
    <button id="cL" class="cbtn">◀<span>方向燈</span></button>
    <button id="cLights" class="cbtn">💡<span>大燈</span></button>
    <button id="cWipers" class="cbtn">〰<span>雨刷</span></button>
    <button id="cH" class="cbtn">⚠<span>警示燈</span></button>
    <button id="cHorn" class="cbtn">📯<span>喇叭</span></button>
    <button id="cR" class="cbtn">▶<span>方向燈</span></button>
  </div>
  <canvas id="cluster" width="520" height="230"></canvas>
</div>

<!-- 時間天氣 -->
<div id="envPanel" class="hidden">
  <div class="e-head">環境設定 <button id="envClose">✕</button></div>
  <div id="envBody"></div>
</div>

<!-- 觸控按鈕 -->
<div id="touch" class="hidden">
  <div class="tleft">
    <button class="tc" data-k="left">◀</button>
    <button class="tc" data-k="right">▶</button>
  </div>
  <div class="tright">
    <button class="tc brake" data-k="down">煞車<small>停住按住＝倒車</small></button>
    <button class="tc gas" data-k="up">油門</button>
  </div>
</div>

<!-- 改裝廠 -->
<div id="garage" class="hidden">
  <div class="g-head">
    <div class="g-title">改裝廠</div>
    <div class="chip">💰 <span id="gCoins">0</span></div>
  </div>
  <div id="gService" class="g-service"></div>
  <div id="gTabs" class="g-tabs"></div>
  <div id="gBody" class="g-body"></div>
  <div id="gBuy" class="g-buy"></div>
  <button id="gExit" class="btn-big g-exit">🚛 開出去送貨</button>
</div>

<!-- 3D 改裝展示控制台 -->
<div id="showroomHud" class="hidden" aria-label="3D 展示控制台">
  <div class="showroom-brand"><span class="live-dot"></span><div><b>SHOWROOM / 01</b><small>專屬重型卡車展示間</small></div></div>
  <div class="showroom-controls">
    <button id="viewFront" title="車頭視角">車頭</button>
    <button id="viewSide" title="側面視角">側面</button>
    <button id="viewRear" title="車尾視角">車尾</button>
    <button id="viewHigh" title="高角度視角">俯視</button>
    <i></i>
    <button id="zoomOut" title="縮小">−</button>
    <button id="zoomIn" title="放大">＋</button>
    <button id="rotateToggle" class="active" title="切換自動旋轉">⟳ 自動旋轉</button>
    <button id="viewReset" title="重設視角">重設</button>
  </div>
  <div class="showroom-focus" aria-label="零件快速檢視">
    <span>快速檢視</span>
    <button data-focus="paint" title="車身烤漆">烤漆</button>
    <button data-focus="wheel" title="輪框與輪胎">輪框</button>
    <button data-focus="front" title="車頭與保險桿">車頭</button>
    <button data-focus="exhaust" title="排氣管">排氣管</button>
    <button data-focus="roof" title="車頂燈具">車頂</button>
    <button data-focus="trailer" title="拖車與車斗">拖車</button>
    <button data-focus="overview" title="整車總覽">整車</button>
  </div>
  <div class="showroom-tip">拖曳畫面旋轉視角　・　滾輪縮放　・　選擇改裝項目自動靠近零件</div>
</div>

<div id="toast"></div>
<div id="popup"></div>
<div id="ver"></div>

<script type="module" src="game.js"></script>
<script>
  setTimeout(function () {
    if (document.getElementById("startBtn").disabled) document.getElementById("loadMsg").textContent = "載入失敗或網路太慢，請檢查網路後重新整理頁面";
  }, 15000);
</script>
</body>
</html>
