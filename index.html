<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>卡車改裝王</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡車改裝王">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- 開始畫面 -->
<div id="title">
  <div class="title-box">
    <div class="t-kicker">寫實重型卡車模擬</div>
    <h1>卡車改裝王</h1>
    <p class="sub">開聯結車送貨賺錢，把卡車改裝成你的專屬座駕。</p>
    <div id="tStats" class="t-stats"></div>
    <!-- v33：主選單（9 項） -->
    <nav class="tmenu">
      <button id="startBtn" class="ti main" disabled><b>▶ 繼續遊戲</b><small>從上次的進度接著開</small></button>
      <button class="ti" data-go="new"><b>🚚 開始遊戲</b><small>開新的運輸生涯</small></button>
      <button class="ti" data-go="jobs"><b>📋 工作任務</b><small>貨運市場挑貨物接單</small></button>
      <button class="ti" data-go="garage"><b>🏆 卡車車庫</b><small>收藏的卡車、換車</small></button>
      <button class="ti" data-go="mods"><b>🔧 卡車改裝</b><small>烤漆、零件、性能</small></button>
      <button class="ti" data-go="map"><b>🗺 世界地圖</b><small>城市、國道、物流中心</small></button>
      <button class="ti" data-go="fleet"><b>🏢 車隊管理</b><small>買車、雇司機、派遣</small></button>
      <button class="ti" data-go="settings"><b>⚙️ 遊戲設定</b><small>畫質、聲音、操作</small></button>
      <button class="ti" data-go="save"><b>💾 存檔管理</b><small>匯出、匯入、重新開始</small></button>
    </nav>
    <div class="menu-row">
      <button class="mbtn" data-menu="tutorial">🎓 新手教學</button>
      <button class="mbtn" data-menu="money">💰 財務</button>
      <button class="mbtn" data-menu="ach">🏅 成就</button>
      <button class="mbtn" data-menu="help">⌨️ 操作說明</button>
      <a class="mbtn" href="side.html" style="text-decoration:none">🎬 橫向電影模式</a>
    </div>
    <div id="loadMsg" class="load">載入中…</div>
  </div>
</div>

<!-- 開車畫面 -->
<div id="hud" class="hidden">
  <div class="top-left">
    <div id="coins" class="chip" title="金幣">💰 <span id="coinNum">0</span></div>
  </div>
  <div id="mission">
    <div id="navArrow">➤</div>
    <div id="missionText"></div>
  </div>
  <div class="top-right">
    <button id="bJobs" class="tbtn">📋<span>接單</span></button>
    <button id="bGarage" class="tbtn">🔧<span>改裝廠</span></button>
    <button id="bEnv" class="tbtn">🌤<span>天氣</span></button>
    <button id="bCam" class="tbtn">📷<span>鏡頭</span></button>
    <button id="bReset" class="tbtn">🔄<span>回廠</span></button>
    <button id="bMap" class="tbtn">🗺<span>地圖</span></button>
    <button id="bSound" class="tbtn">🔊<span>聲音</span></button>
    <button id="bMenu" class="tbtn">☰<span>選單</span></button>
  </div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="controls">
    <button id="cL" class="cbtn">◀<span>方向燈</span></button>
    <button id="cLights" class="cbtn">💡<span>大燈</span></button>
    <button id="cWipers" class="cbtn">〰<span>雨刷</span></button>
    <button id="cH" class="cbtn">⚠<span>警示燈</span></button>
    <button id="cHorn" class="cbtn">📯<span>喇叭</span></button>
    <button id="cRet" class="cbtn on">🛑<span>排氣煞車</span></button>
    <button id="cPark" class="cbtn">🅿<span>手煞車</span></button>
    <button id="cCouple" class="cbtn">🔗<span>接拖車</span></button>
    <button id="cGbx" class="cbtn">A<span>自排</span></button>
    <button id="cDown" class="cbtn gbx-m">－<span>降檔</span></button>
    <button id="cUp" class="cbtn gbx-m">＋<span>升檔</span></button>
    <button id="cR" class="cbtn">▶<span>方向燈</span></button>
  </div>
  <canvas id="cluster" width="520" height="230"></canvas>
</div>

<!-- v31：選單（成就、設定、存檔）、新手教學提示 -->
<div id="menuPanel" class="hidden"><div id="menuBody"></div></div>
<div id="tutBox" class="hidden"></div>
<div id="fpsBox" class="hidden"></div>

<!-- v33：世界地圖（M） -->
<div id="mapPanel" class="hidden">
  <canvas id="worldMap"></canvas>
  <div class="wm-bar"><b>🗺 世界地圖</b><span id="wmInfo"></span>
    <button id="wmFollow">📍 我的位置</button><button id="wmIn">＋</button><button id="wmOut">－</button><button id="wmClose">✕ 關閉（M）</button></div>
  <div class="wm-legend"><span class="lg-route">導航路線</span><span class="lg-hw">國道</span><span class="lg-el">高架／匝道</span><span class="lg-dp">物流點</span>　拖曳移動、滾輪縮放</div>
</div>

<!-- v28：接單板／送貨收據 -->
<div id="jobPanel" class="hidden"><div id="jobBody"></div></div>

<!-- 時間天氣 -->
<div id="envPanel" class="hidden">
  <div class="e-head">環境設定 <button id="envClose">✕</button></div>
  <div id="envBody"></div>
</div>

<!-- 觸控按鈕 -->
<div id="touch" class="hidden">
  <div class="tleft">
    <button class="tc" data-k="left">◀</button>
    <button class="tc" data-k="right">▶</button>
  </div>
  <div class="tright">
    <button class="tc brake" data-k="down">煞車<small>停住按住＝倒車</small></button>
    <button class="tc gas" data-k="up">油門</button>
  </div>
</div>

<!-- 改裝廠 -->
<div id="garage" class="hidden">
  <div class="g-head">
    <div class="g-title">改裝廠</div>
    <div class="chip">💰 <span id="gCoins">0</span></div>
  </div>
  <div id="gService" class="g-service"></div>
  <div id="gTabs" class="g-tabs"></div>
  <div id="gBody" class="g-body"></div>
  <div id="gBuy" class="g-buy"></div>
  <button id="gExit" class="btn-big g-exit">🚛 開出去送貨</button>
</div>

<!-- 3D 改裝展示控制台 -->
<div id="showroomHud" class="hidden" aria-label="3D 展示控制台">
  <div class="showroom-brand"><span class="live-dot"></span><div><b>SHOWROOM / 01</b><small>專屬重型卡車展示間</small></div></div>
  <div class="showroom-controls">
    <button id="viewFront" title="車頭視角">車頭</button>
    <button id="viewSide" title="側面視角">側面</button>
    <button id="viewRear" title="車尾視角">車尾</button>
    <button id="viewHigh" title="高角度視角">俯視</button>
    <i></i>
    <button id="zoomOut" title="縮小">−</button>
    <button id="zoomIn" title="放大">＋</button>
    <button id="rotateToggle" class="active" title="切換自動旋轉">⟳ 自動旋轉</button>
    <button id="viewReset" title="重設視角">重設</button>
  </div>
  <div class="showroom-focus" aria-label="零件快速檢視">
    <span>快速檢視</span>
    <button data-focus="paint" title="車身烤漆">烤漆</button>
    <button data-focus="wheel" title="輪框與輪胎">輪框</button>
    <button data-focus="front" title="車頭與保險桿">車頭</button>
    <button data-focus="exhaust" title="排氣管">排氣管</button>
    <button data-focus="roof" title="車頂燈具">車頂</button>
    <button data-focus="trailer" title="拖車與車斗">拖車</button>
    <button data-focus="overview" title="整車總覽">整車</button>
  </div>
  <div class="showroom-tip">拖曳畫面旋轉視角　・　滾輪縮放　・　選擇改裝項目自動靠近零件</div>
</div>

<div id="toast"></div>
<div id="popup"></div>
<div id="ver"></div>

<script type="module" src="game.js"></script>
<script>
  setTimeout(function () {
    if (document.getElementById("startBtn").disabled) document.getElementById("loadMsg").textContent = "載入失敗或網路太慢，請檢查網路後重新整理頁面";
  }, 15000);
</script>
</body>
</html>
