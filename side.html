<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>卡車改裝王｜橫向電影模式</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; color: #f1e6cf; user-select: none; -webkit-user-select: none; touch-action: none; }
  /* 毛玻璃＋細金邊＋內發光，滑鼠移上去平滑浮起 */
  :root { --gold: rgba(214,178,98,.6); --gold-hi: rgba(245,214,140,.95); --ease: cubic-bezier(.22,1,.36,1); }
  .chip, .btn, .pedal, #garageUI, #toast { background: linear-gradient(160deg, rgba(40,36,30,.42), rgba(12,14,18,.55)) !important; border: 1px solid var(--gold) !important; box-shadow: inset 0 0 14px rgba(255,214,150,.12), inset 0 1px 0 rgba(255,240,200,.25), 0 10px 28px rgba(0,0,0,.4) !important; backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); color: #f6e7c8 !important; letter-spacing: .5px; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease); }
  .btn:hover, .pedal:hover, .opt:hover { transform: translateY(-2px); border-color: var(--gold-hi) !important; box-shadow: inset 0 0 18px rgba(255,214,150,.22), 0 0 18px rgba(214,178,98,.35), 0 12px 30px rgba(0,0,0,.45) !important; }
  .btn.on, .opt.sel { background: linear-gradient(160deg, rgba(214,178,98,.75), rgba(150,108,40,.75)) !important; color: #1a140a !important; border-color: var(--gold-hi) !important; }
  .opt { transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease); border-color: rgba(214,178,98,.35) !important; background: rgba(20,22,26,.55) !important; color: #f1e6cf !important; font-family: inherit; }
  .sw { transition: transform .3s var(--ease); } .sw:hover { transform: scale(1.12); }
  #garageUI h3 { font-weight: 900; letter-spacing: 1px; color: #f3d28d !important; text-shadow: 0 0 10px rgba(214,178,98,.35); }
  button, a.btn { font-family: inherit; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .bar { position: fixed; top: 10px; display: flex; gap: 8px; z-index: 5; }
  .bar.left { left: 10px; } .bar.right { right: 10px; }
  .chip { background: rgba(10,14,19,.72); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 8px 12px; font-weight: 900; font-size: 16px; backdrop-filter: blur(6px); }
  .btn { background: rgba(10,14,19,.72); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; color: #e8edf2; padding: 8px 12px; font-size: 15px; font-weight: 800; cursor: pointer; backdrop-filter: blur(6px); }
  .btn.on { background: linear-gradient(135deg,#ffd47a,#e99a2b); color: #15191e; border-color: #ffd47a; }
  .pedals { position: fixed; bottom: 18px; z-index: 5; display: flex; gap: 14px; }
  .pedals.left { left: 18px; } .pedals.right { right: 18px; }
  .pedal { width: 96px; height: 96px; border-radius: 22px; border: 2px solid rgba(255,255,255,.25); background: rgba(10,14,19,.6); color: #fff; font-size: 30px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .pedal small { font-size: 13px; }
  .pedal.on { background: rgba(255,180,60,.55); }
  #garageUI { position: fixed; right: 12px; top: 64px; bottom: 12px; width: min(330px, 44vw); z-index: 6; overflow: auto; background: rgba(10,12,16,.82); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 12px; display: none; backdrop-filter: blur(8px); }
  #garageUI h3 { margin: 4px 0 8px; font-size: 16px; color: #f7c66b; }
  .sw { width: 32px; height: 32px; border-radius: 9px; border: 2px solid rgba(255,255,255,.25); cursor: pointer; }
  .sw.sel { outline: 3px solid #ffd47a; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .opt { padding: 8px 10px; border-radius: 10px; border: 1px solid #3a4652; background: #1a2530; color: #e8edf2; font-weight: 800; cursor: pointer; font-size: 14px; }
  .opt.sel { background: linear-gradient(135deg,#ffd47a,#e99a2b); color: #15191e; border-color: #ffd47a; }
  .opt.lock { opacity: .5; }
  .note { font-size: 12px; color: #9eacb9; line-height: 1.5; margin: 6px 0 10px; }
  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9; background: rgba(10,14,19,.85); border-radius: 12px; padding: 10px 16px; font-weight: 800; opacity: 0; transition: opacity .3s; pointer-events: none; }
  @media (max-width: 760px) { .pedal { width: 76px; height: 76px; font-size: 24px; } .btn { padding: 7px 9px; font-size: 13px; } #garageUI { top: auto; height: 46vh; width: auto; left: 12px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar left">
  <div class="chip" id="coins">💰 0</div>
  <div class="chip" id="speed">0 km/h</div>
</div>
<div class="bar right">
  <button class="btn" id="bTime">☀️ 白天</button>
  <button class="btn" id="bWeather">🌤 晴天</button>
  <button class="btn" id="bLights">💡 大燈</button>
  <button class="btn" id="bGarage">🔧 車庫</button>
  <button class="btn on" id="bFx">🎞 電影濾鏡</button>
  <a class="btn" href="./" style="text-decoration:none">🚛 回 3D 版</a>
</div>
<div class="pedals left"><button class="pedal" id="pBrake">◀<small>煞車／倒車</small></button></div>
<div class="pedals right"><button class="pedal" id="pGas">▶<small>油門</small></button></div>
<div id="garageUI"></div>
<div id="toast"></div>
<script type="module" src="js/side.js"></script>
</body>
</html>
